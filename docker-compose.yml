x-postgres-admin-creds: &postgres-admin-creds
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin-bootstrap-password
  POSTGRES_DB: ecom

services:
  api:
    image: nodejspro-ecom-api:prod
    build:
      context: .
      target: runner
    env_file:
      # required: false — a fresh clone has no .env yet (gitignored by
      # design). Without this, *any* `docker compose` command fails outright
      # ("env file .env not found"), even one scoped only to `postgres` —
      # Compose validates every service's config up front, not just the one
      # you're targeting.
      - path: .env
        required: false
    # Deliberately disconnected from Infisical for now, to meet HW #13's
    # acceptance criteria — `docker compose up -d --wait`, then
    # migrate/seed/demo/report run straight against Postgres as admin with
    # /scripts/with-secrets.sh.
    # volumes:
    #   - infisical_secrets:/shared-secrets:ro
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    depends_on:
      # Same reason as the volumes note above.
      # infisical-agent:
      #   condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 300M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      <<: *postgres-admin-creds
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d ecom']
      interval: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Opt-in only: `docker compose --profile rotation up -d`. Reactively (and,
  # via reconcile.sh, unconditionally on its own startup) keeps app_user's
  # Postgres password in sync with whatever's current in Infisical. Not part
  # of the default `docker compose up` — api no longer depends on it or
  # reads its output (api gets its own DB credentials at boot via
  # scripts/with-secrets.sh instead), so this container is purely the
  # rotation path and never blocks bringing the rest of the stack up.
  infisical-agent:
    profiles: ['rotation']
    build:
      context: ./infisical
    restart: unless-stopped
    init: true
    entrypoint: ['/bin/sh', '/etc/infisical/entrypoint.sh']
    secrets:
      - infisical_client_secret
    environment:
      <<: *postgres-admin-creds
      INFISICAL_ENV: prod
    volumes:
      - ./infisical/agent-config.yaml:/etc/infisical/agent-config.yaml:ro
      - ./infisical/entrypoint.sh:/etc/infisical/entrypoint.sh:ro
      - ./infisical/configs/project_id:/etc/infisical/configs/project_id:ro
      - ./infisical/configs/client_id:/etc/infisical/configs/client_id:ro
      - ./infisical/templates/db-password-template.txt:/etc/infisical/templates/db-password-template.txt:ro
      - ./infisical/on-change.sh:/etc/infisical/on-change.sh:ro
      - ./infisical/reconcile.sh:/etc/infisical/reconcile.sh:ro
      - infisical_secrets:/shared-secrets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /shared-secrets/db-password &&
          PGPASSWORD="$(cat /shared-secrets/db-password)" psql -h postgres -U app_user -d ecom -c "SELECT 1" >/dev/null 2>&1
      interval: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  infisical_secrets:

secrets:
  infisical_client_secret:
    file: ./infisical/secrets/client_secret
