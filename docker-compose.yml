x-postgres-admin-creds: &postgres-admin-creds
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin-bootstrap-password
  POSTGRES_DB: ecom

services:
  api:
    image: nodejspro-ecom-api:prod
    build:
      context: .
      target: runner
    env_file:
      # required: false — a fresh clone has no .env yet (gitignored by
      # design). Without this, *any* `docker compose` command fails outright
      # ("env file .env not found"), even one scoped only to `postgres` —
      # Compose validates every service's config up front, not just the one
      # you're targeting.
      - path: .env
        required: false
    # PORT/DB_URL have no default in src/config/env.schema.ts (by design —
    # they're meant to be required), so on a fresh clone with no .env the
    # app fails config validation and never becomes healthy, which fails
    # `docker compose up -d --wait` outright (HW #13's grading needs the
    # whole default profile up, not just postgres). ${VAR:-default} still
    # picks up a real .env's values for interpolation — this only supplies
    # the fallback a fresh clone is missing. DB_URL itself is never read by
    # the running app (see Configuration | HW #11) — any syntactically
    # valid value satisfies the schema. Points at pgbouncer, not postgres
    # directly, as of HW #15 — the app (like every DB-touching script) goes
    # through the pooler now.
    environment:
      PORT: ${PORT:-3000}
      DB_URL: ${DB_URL:-postgresql://admin:admin-bootstrap-password@pgbouncer:6432/ecom}
    # Deliberately disconnected from Infisical for now, to meet HW #13's
    # acceptance criteria — `docker compose up -d --wait`, then
    # migrate/seed/demo/report run straight against Postgres as admin with
    # /scripts/with-secrets.sh.
    # volumes:
    #   - infisical_secrets:/shared-secrets:ro
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    depends_on:
      # Same reason as the volumes note above.
      # infisical-agent:
      #   condition: service_healthy
      # Transitively waits on postgres too — pgbouncer's own depends_on
      # already requires it healthy first.
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 300M

  # One-shot: fresh named volumes are root-owned, but archive_mode's
  # archive_command below runs as the `postgres` user — without this,
  # archiving fails outright with "Permission denied" on the very first WAL
  # segment. Uses the `postgres` username rather than a hardcoded uid, so it
  # isn't tied to one image's numeric ID. Runs to completion and exits;
  # `postgres` waits on that, not on it staying up.
  postgres-volumes-init:
    image: postgres:17-alpine
    entrypoint:
      ['sh', '-c', 'chown -R postgres:postgres /wal_archive /basebackup']
    volumes:
      - wal_archive:/wal_archive
      - basebackup:/basebackup

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      <<: *postgres-admin-creds
    # wal_level=replica is already PG17's default — set explicitly so PITR's
    # requirement is documented, not implicit. archive_mode/archive_command
    # are what make scripts/pitr-drill.sh possible: without continuous WAL
    # archiving, a base backup alone only gives a single point in time, not
    # a range you can recover to (see PITR-DRILL.md).
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - wal_archive:/wal_archive
      - basebackup:/basebackup
    depends_on:
      postgres-volumes-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d ecom']
      interval: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Opt-in only: `docker compose --profile pitr up -d --wait pitr`. The PITR
  # restore target — scripts/pitr-drill.sh seeds its volume from a base
  # backup before starting this, so Postgres's entrypoint finds an
  # already-initialized PGDATA and goes straight into WAL recovery instead
  # of running initdb. See PITR-DRILL.md.
  pitr:
    image: postgres:17-alpine
    profiles: ['pitr']
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata_pitr:/var/lib/postgresql/data
      - wal_archive:/wal_archive:ro

  # Opt-in only: `docker compose --profile drill up -d --wait restore`. The
  # restore-drill's target — a genuinely empty Postgres (no db/init.sql, no
  # shared volume with the real `postgres`), so scripts/restore-drill.sh's
  # pg_restore into it proves the dump alone can recreate the schema, not
  # that some leftover state was already there. Own port (5434) so it can
  # run alongside the real `postgres` on 5432. See RESTORE-DRILL.md.
  restore:
    image: postgres:17-alpine
    profiles: ['drill']
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      <<: *postgres-admin-creds
    volumes:
      - pgdata_restore:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d ecom']
      interval: 2s
      retries: 20

  # Opt-in only: `docker compose --profile pgbackups up -d`. A second,
  # container-native backup mechanism alongside scripts/backup.sh's host cron
  # — same idea (pg_dump, direct to postgres, never through PgBouncer — a
  # dump is one long operation with nothing to pool), but the schedule lives
  # inside the container instead of the host's crontab, sidestepping the
  # PATH/environment issues host cron has with `docker`. Own dump format and
  # own directory (./pgbackups/, not backups/) — the two mechanisms don't
  # share retention or output.
  pgbackups:
    image: prodrigestivill/postgres-backup-local:17
    profiles: ['pgbackups']
    restart: unless-stopped
    user: postgres:postgres
    environment:
      <<: *postgres-admin-creds
      POSTGRES_HOST: postgres
      SCHEDULE: '0 3 * * *'
      BACKUP_ON_START: 'TRUE'
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # The image's own baked-in HEALTHCHECK polls every 300s — fine for a
    # backup job, but it'd make `--wait` sit idle for up to 5 minutes on
    # first start, unlike every other service here. Same check, shorter
    # interval.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/']
      interval: 5s
      retries: 5
      start_period: 10s

  # Everything else (the app, migrate/seed/demo scripts, backup/restore-drill)
  # connects here, not to postgres directly — see README's "Data layer ops"
  # section for what pool_mode = transaction buys and what it breaks.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U admin -d ecom']
      interval: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Opt-in only: `docker compose --profile rotation up -d`. Reactively (and,
  # via reconcile.sh, unconditionally on its own startup) keeps app_user's
  # Postgres password in sync with whatever's current in Infisical. Not part
  # of the default `docker compose up` — api no longer depends on it or
  # reads its output (api gets its own DB credentials at boot via
  # scripts/with-secrets.sh instead), so this container is purely the
  # rotation path and never blocks bringing the rest of the stack up.
  infisical-agent:
    profiles: ['rotation']
    build:
      context: ./infisical
    restart: unless-stopped
    init: true
    entrypoint: ['/bin/sh', '/etc/infisical/entrypoint.sh']
    secrets:
      - infisical_client_secret
    environment:
      <<: *postgres-admin-creds
      INFISICAL_ENV: prod
    volumes:
      - ./infisical/agent-config.yaml:/etc/infisical/agent-config.yaml:ro
      - ./infisical/entrypoint.sh:/etc/infisical/entrypoint.sh:ro
      - ./infisical/configs/project_id:/etc/infisical/configs/project_id:ro
      - ./infisical/configs/client_id:/etc/infisical/configs/client_id:ro
      - ./infisical/templates/db-password-template.txt:/etc/infisical/templates/db-password-template.txt:ro
      - ./infisical/on-change.sh:/etc/infisical/on-change.sh:ro
      - ./infisical/reconcile.sh:/etc/infisical/reconcile.sh:ro
      - infisical_secrets:/shared-secrets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /shared-secrets/db-password &&
          PGPASSWORD="$(cat /shared-secrets/db-password)" psql -h postgres -U app_user -d ecom -c "SELECT 1" >/dev/null 2>&1
      interval: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  infisical_secrets:
  pgdata_restore:
  wal_archive:
  basebackup:
  pgdata_pitr:

secrets:
  infisical_client_secret:
    file: ./infisical/secrets/client_secret
