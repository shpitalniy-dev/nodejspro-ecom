services:
  api:
    image: nodejspro-ecom-api:prod
    build:
      context: .
      target: runner
    env_file:
      - .env
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 300M
