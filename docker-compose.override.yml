services:
  api:
    image: nodejspro-ecom-api:dev
    build:
      context: .
      target: deps
    environment:
      - NODE_ENV=development
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 300M
    volumes:
      - .:/app
      - /app/node_modules
