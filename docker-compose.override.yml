services:
  api:
    image: nodejspro-ecom-api:dev
    build:
      context: .
      target: deps
    environment:
      - NODE_ENV=development
    command: npm run dev
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 300M
    volumes:
      - .:/app
      - /app/node_modules

  infisical-agent:
    environment:
      INFISICAL_ENV: dev
