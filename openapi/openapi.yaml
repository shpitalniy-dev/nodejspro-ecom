openapi: 3.0.3
info:
  title: E-commerce API
  version: 1.0.0
  description: >
    Contract-first API for e-commerce: browsing products and placing
    orders.
servers:
  - url: http://localhost:3000
security: []

paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      tags:
        - products
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Rate limit exceeded (HW #23) — RateLimitGuard, shared across
            instances via Redis.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
                example: '2'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /products/{productId}:
    get:
      operationId: getProduct
      summary: Get a single product by id
      tags:
        - products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid productId.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateProductPrice
      summary: Update a product's price (admin only)
      description: >
        HW#24 slice 3: admin-only — RolesGuard trusts the access token's
        own `role` claim rather than re-reading it from the DB (see
        README's Authorization section for the deliberate staleness
        tradeoff this implies).
      tags:
        - products
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid productId or request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing, invalid, expired, or denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller's role is not admin.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      summary: Create a new order
      tags:
        - orders
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: >
            Client-generated key that makes retrying this request safe.
            The first request carrying a given key is executed normally;
            any retry that reuses the same key together with the exact
            same request body returns the response that was already
            produced instead of creating a second order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URL of the newly created order.
              required: true
              schema:
                type: string
            Idempotency-Replay:
              description: >
                Present and set to "true" when this response was replayed
                from an earlier request that used the same Idempotency-Key.
              schema:
                type: string
                example: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation failed for the request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            A request with this Idempotency-Key is already being
            processed; retry once it completes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >
            The Idempotency-Key was reused with a request body that
            differs from the original request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get a single order by id
      description: >
        HW#24 slice 3: ownership-gated — a caller may only read an order
        that belongs to them (see README's Authorization section).
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid orderId.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing, invalid, expired, or denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The order exists but belongs to a different user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      summary: Change an order's status
      description: >
        HW#18: the write side of the realtime notification feature. A
        successful change publishes an `order.status` event to that
        order's WebSocket room and SSE stream (see the Realtime
        Notifications section in README.md) — this endpoint itself just
        performs the status write.
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid orderId or request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      operationId: login
      summary: Log in and receive an access token
      description: >
        Also sets the __Host-rt refresh cookie (httpOnly, Secure,
        SameSite=Strict — see README's Auth section). LoginRateLimitGuard
        and PasswordService's own ConcurrencyLimiter both guard this route
        against the memory cost of concurrent argon2id password
        verification; either one tripping returns the same 429 below.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Email or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Too many login attempts in flight — either LoginRateLimitGuard
            (per-client) or PasswordService's concurrency limiter (global)
            tripped.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
                example: '2'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      description: >
        No request body — reads the __Host-rt cookie. Every rejection
        (unknown, expired, already-revoked, or reused token) returns the
        same 401 and clears the cookie; a reused token additionally
        revokes its whole family server-side (see README's Auth section),
        not just itself, which is what also invalidates whatever token the
        legitimate client was issued one rotation ahead.
      tags:
        - auth
      responses:
        '200':
          description: New access token issued; __Host-rt cookie rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: >
            Missing, unknown, expired, revoked, or reused refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Identity from the current access token
      description: >
        The access token only proves identity (its subject); the response
        here is read fresh from the DB rather than from the token's own
        role claim, since a role can change after the token was issued —
        the token's role is a cache/UI-hint, not re-used as the source of
        truth here (see README's Auth section).
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, invalid, expired, or denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      operationId: logout
      summary: Log out — denylists the access token and revokes the refresh family
      description: >
        Two actions: denylists the access token's jti for its own
        remaining TTL (best-effort — see AccessDenylistService's own
        comment on why a Redis failure here doesn't fail the request), and
        revokes the __Host-rt cookie's refresh family if the cookie is
        present. The cookie is cleared either way.
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out.
        '401':
          description: Missing, invalid, expired, or already-denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /uploads/intent:
    post:
      operationId: createUploadIntent
      summary: Start a presigned upload (HW #26)
      description: >
        Two-step upload contract: this issues a presigned PUT URL and a
        pending files row; the client PUTs bytes straight to storage (no
        bytes cross this API — see demo:upload's put-offline check), then
        calls /uploads/commit. The object key is always server-generated
        (uploads/{ownerUuid}/{uuid}.{ext}) — the client's filename, if
        sent, is accepted for display only and never used to build it.
      tags:
        - uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '200':
          description: Presigned upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentResponse'
        '400':
          description: Invalid request body (e.g. disallowed contentType).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing, invalid, expired, or denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The access token's own user no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /uploads/commit:
    post:
      operationId: commitUpload
      summary: Confirm a presigned upload actually landed in storage
      description: >
        HeadObject against the key from /uploads/intent — without this,
        a client could "commit" bytes it never uploaded. 409 means
        exactly that: the row exists, but storage has no object for it.
      tags:
        - uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCommitRequest'
      responses:
        '200':
          description: Upload confirmed and marked completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCommitResponse'
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing, invalid, expired, or denylisted access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: This upload belongs to another user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No upload with this fileUuid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            No object was ever PUT to this upload's key — nothing to
            commit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        Opaque pagination token taken from a previous response's
        `next_cursor`. Clients must treat it as an unstructured string and
        must not attempt to parse or construct one themselves.
  schemas:
    ProductListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque cursor for the next page, or null when there are no
            more pages.

    OrderListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque cursor for the next page, or null when there are no
            more pages.

    Currency:
      type: string
      enum: [USD]
      description: ISO 4217 currency code. Only USD is supported currently.
      example: USD

    Product:
      type: object
      required:
        - id
        - key
        - price_cents
        - currency
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        key:
          type: string
        price_cents:
          type: integer
          description: Price in the smallest currency unit (e.g. cents).
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
          format: date-time

    UpdateProductRequest:
      type: object
      additionalProperties: false
      required:
        - price_cents
      properties:
        price_cents:
          type: integer
          minimum: 0
          description: Price in the smallest currency unit (e.g. cents).

    OrderItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1

    Order:
      type: object
      required:
        - id
        - status
        - total_cents
        - currency
        - items
        - created_at
        - user_id
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
          # Widened from [unpaid, paid] for HW#18: checkout() only ever
          # produced those two, but the new PATCH .../status endpoint
          # below (and existing seed data) can produce all four.
          enum: [unpaid, pending, paid, refunded]
        total_cents:
          type: integer
          description: Total order amount in the smallest currency unit (e.g. cents).
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        user_id:
          type: integer
          minimum: 1
          description: >
            Id of the order's owning customer. Exposed for HW#18's WS
            ownership check and its headless demo script — there's no auth
            yet, so a client has no other way to learn which user id an
            order belongs to.

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
      additionalProperties: false

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [unpaid, pending, paid, refunded]
      additionalProperties: false

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      additionalProperties: false

    LoginResponse:
      type: object
      required:
        - accessToken
        - expiresIn
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 600

    CurrentUser:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string

    UploadIntentRequest:
      type: object
      additionalProperties: false
      required:
        - contentType
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: >
            Allowlisted MIME type — determines the generated object key's
            extension.
        filename:
          type: string
          description: >
            Accepted for display purposes only — never used to build the
            storage key (see files.service.ts's createIntent()).

    UploadIntentResponse:
      type: object
      required:
        - fileUuid
        - key
        - uploadUrl
        - expiresIn
      properties:
        fileUuid:
          type: string
          format: uuid
        key:
          type: string
          description: Server-generated object key.
        uploadUrl:
          type: string
          format: uri
          description: >
            Presigned PUT URL — upload the file's bytes directly here,
            then call /uploads/commit.
        expiresIn:
          type: integer
          description: Seconds until uploadUrl expires.
          example: 300

    UploadCommitRequest:
      type: object
      additionalProperties: false
      required:
        - fileUuid
      properties:
        fileUuid:
          type: string
          format: uuid

    UploadCommitResponse:
      type: object
      required:
        - fileUuid
        - key
        - status
        - size
      properties:
        fileUuid:
          type: string
          format: uuid
        key:
          type: string
        status:
          type: string
          enum: [completed]
        size:
          type: integer
          description: Byte size, read back from storage via HeadObject.

    Problem:
      type: object
      description: >
        RFC 9457 problem detail, returned as `application/problem+json`
        for every 4xx/5xx response.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - method
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            Stable URI identifying this class of error. Clients should
            match on this field, never on `detail` text, since `detail`
            varies between occurrences of the same problem type.
          example: /problems/not-found
        title:
          type: string
          description: >
            Short, human-readable summary that is the same for every
            occurrence of this problem type.
          example: Resource not found
        status:
          type: integer
          description: The HTTP status code for this occurrence, duplicated here for convenience.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: Order 99 not found
        instance:
          type: string
          format: uri-reference
          description: Reference identifying the specific request that produced this problem.
          example: /orders/99
        method:
          type: string
          description: >
            HTTP method of the request that produced this problem;
            paired with `instance` this fully identifies the request.
          example: GET
        errors:
          type: array
          description: >
            Present only on validation problems: one entry per invalid
            field in the request body.
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    ProblemFieldError:
      type: object
      required:
        - field
        - constraints
      properties:
        field:
          type: string
          description: Name of the invalid field.
          example: items
        constraints:
          type: array
          items:
            type: string
          description: Human-readable description of each rule this field violated.
          example: ['must NOT have fewer than 1 items']
