# Mounted into otel-lgtm's Grafana at
# /etc/grafana/provisioning/datasources/ — a distinct filename from the
# image's own built-in Prometheus/Tempo/Loki datasources, so this adds to
# them rather than colliding. `prometheus` resolves via compose's own
# network (both services share this file's project network).
apiVersion: 1

datasources:
  - name: nodejspro-ecom-prometheus
    uid: nodejspro-ecom-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
