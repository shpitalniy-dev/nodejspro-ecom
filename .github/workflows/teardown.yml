name: teardown

# Tears down the demo stack (RDS, ALB, NAT) on demand. The nightly schedule
# was removed after HW #31: the stack and its CI role are destroyed. Auth is the
# OIDC role infra/base's CiRole component creates — no AWS keys stored in
# GitHub at all. No PULUMI_CONFIG_PASSPHRASE: Pulumi Cloud (not a self-hosted
# backend) handles secrets encryption on its own.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

jobs:
  teardown:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # this job only — required for GitHub to issue the OIDC token
    defaults:
      run:
        working-directory: infra/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: npm ci

      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1

      # Region and tags come from the demo stack's own config (Pulumi.dev.yaml)
      # — the single source of truth, nothing duplicated in this file. Needs
      # only the Pulumi token, so it runs before AWS credentials exist.
      - name: read stack config
        run: |
          set -euo pipefail
          # Plain assignments, not $(...) inside echo: set -e only aborts on
          # a failed substitution when it's an assignment, and an empty tag
          # would make tagged-resources-left a false 0.
          region=$(pulumi config get aws:region --stack dev)
          project=$(pulumi config get --path 'aws:defaultTags.tags.Project' --stack dev)
          stack=$(pulumi config get --path 'aws:defaultTags.tags.Stack' --stack dev)
          {
            echo "AWS_REGION=$region"
            echo "PROJECT_TAG=$project"
            echo "STACK_TAG=$stack"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.HW31_CI_ROLE_ARN }} # infra/base stack's ciRoleArn output
          aws-region: ${{ env.AWS_REGION }}

      - name: pulumi destroy
        run: pulumi destroy --yes --skip-preview --stack dev

      - name: six zeros
        run: |
          set -euo pipefail

          # Every count sums both regions: us-east-1 hosts global-service
          # endpoints (IAM, Budgets, billing) and is the usual console
          # default, so it's where a stray resource most often turns up.
          both() {
            local n=0
            for r in "$AWS_REGION" us-east-1; do
              n=$(( n + $("$@" --region "$r" --output text) ))
            done
            echo "$n"
          }

          counts() {
            state=$(pulumi stack export --stack dev | jq '[.deployment.resources[]? | select(.type | startswith("aws:"))] | length')
            # A deleted NAT Gateway stays visible to the tagging API for a
            # while, so it's excluded here — nat counts live ones by state.
            tagged=$(both aws resourcegroupstaggingapi get-resources \
              --tag-filters "Key=Project,Values=$PROJECT_TAG" "Key=Stack,Values=$STACK_TAG" \
              --query "length(ResourceTagMappingList[?!contains(ResourceARN, ':natgateway/')])")
            rds=$(both aws rds describe-db-instances --query 'length(DBInstances)')
            alb=$(both aws elbv2 describe-load-balancers --query 'length(LoadBalancers)')
            nat=$(both aws ec2 describe-nat-gateways --filter Name=state,Values=available,pending --query 'length(NatGateways)')
            eip=$(both aws ec2 describe-addresses --query 'length(Addresses)')
            total=$(( state + tagged + rds + alb + nat + eip ))
          }

          # AWS finishes some deletes after the API call returns (an ALB's
          # public IPs, a NAT's EIP), so re-check until everything reaches 0,
          # up to 20 x 15s. A real leak is still non-zero after that and fails.
          for attempt in $(seq 1 20); do
            counts
            echo "attempt $attempt: state=$state tagged=$tagged rds=$rds alb=$alb nat=$nat eip=$eip"
            [ "$total" -eq 0 ] && break
            sleep 15
          done

          echo "state-resources-left=$state"
          echo "tagged-resources-left=$tagged"
          echo "rds-left=$rds"
          echo "alb-left=$alb"
          echo "nat-left=$nat"
          echo "eip-left=$eip"
          [ "$total" -eq 0 ]
