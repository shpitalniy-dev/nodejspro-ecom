# PgBouncer sits between the app (and every DB-touching script) and
# Postgres — clients talk to this port, not 5432 directly. See README's
# "Data layer ops" section for what pool_mode = transaction costs.

[databases]
ecom = host=postgres port=5432 dbname=ecom

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# app_user's password rotates via Infisical (infisical/on-change.sh runs
# ALTER ROLE directly against postgres — it never writes the new value
# anywhere PgBouncer could read statically). A userlist.txt entry for
# app_user would go stale the moment rotate.sh ran, so instead PgBouncer
# re-checks Postgres's own pg_shadow on every login. auth_user (admin) is
# a superuser, so it can read pg_shadow; admin's own credentials still come
# from userlist.txt below.
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_user = admin

# Same role every HW13/14 script already connects as (see
# db/schema.sql / docker-compose.yml's x-postgres-admin-creds) — reused
# here rather than introducing a second credential just for pooling.
admin_users = admin

pool_mode = transaction
default_pool_size = 10
max_client_conn = 100

# Postgres 17's own default startup parameter PgBouncer doesn't otherwise
# know what to do with; the standard ignore-list entry for this pairing.
ignore_startup_parameters = extra_float_digits
